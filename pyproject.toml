[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-first-aid"
version = "0.1.0"
description = "Audit public repository trust and polish issues before people find them on GitHub."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "RedBeret", email = "espisteven5@gmail.com" }
]
keywords = ["github", "repository", "audit", "cli", "docs", "templates"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repo-first-aid = "repo_first_aid.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
